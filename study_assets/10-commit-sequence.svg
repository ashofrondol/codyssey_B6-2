<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="title desc">
<title id="title">python main.py commit 의 호출 순서</title>
<desc id="desc">commit 명령 한 번이 cli.py 에서 시작해 gitctx.py(git 읽기), redact.py(비밀 가리기), prompts.py(질문지 작성), client.py(API 호출)와 Claude API, polish.py(검사·다듬기), render.py(화면 출력)를 차례로 부르는 순서를 번호 ①~⑪ 과 파일:줄로 보여 준다. 변경 사항이 없으면 ③ 에서 주황 점선을 따라 바로 종료 코드 0 으로 끝난다.</desc>
